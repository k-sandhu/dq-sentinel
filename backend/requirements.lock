# ---------------------------------------------------------------------------
# Pinned runtime dependency set for the BACKEND IMAGE (#290 — reproducible builds).
#
# pyproject.toml declares `>=` floors so the library stays installable in a wide
# range of environments; this file freezes one exact resolution so two `docker
# build`s days apart produce byte-identical dependency layers. `backend/Dockerfile`
# installs from here (`pip install -r requirements.lock`) BEFORE copying app code,
# so editing app code does not bust the dependency layer.
#
# Scope: runtime deps + the `postgres` extra (what the image needs). Dev tooling
# (pytest/ruff) and the other connector extras are deliberately NOT locked — CI
# installs `backend[dev]` from pyproject directly.
#
# Resolved for CPython 3.12 on linux-x86_64 (the image platform) from Windows, so
# regenerate with the same flags — from the REPO ROOT:
#
#   uv pip compile backend/pyproject.toml --extra postgres \
#       --python-version 3.12 --python-platform x86_64-unknown-linux-gnu \
#       -o backend/requirements.lock
#
# Versions are pinned but hashes are not: pip then still picks the right wheel
# variant per architecture (e.g. an arm64 laptop building the same image), which
# `--generate-hashes` would break. Re-add this header block after regenerating —
# uv rewrites the whole file.
