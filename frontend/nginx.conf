# Included at http level (conf.d), so map{} is allowed here.
# Pass WebSocket upgrades through to the backend (assistant chat),
# keep plain keepalive semantics for normal API requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Cache-Control as a VALUE rather than a per-location `add_header` (#309).
# nginx drops every inherited add_header in a context that declares one of its
# own, so a per-location Cache-Control would silently strip the security headers
# from that location's responses — which is exactly why the CSP below used to be
# copy-pasted into three blocks. Keying the value off $uri keeps every
# add_header at server level, where one copy covers every response.
#   - /assets/*  content-hashed by the build, so the name changes when the bytes
#                do: cache for a year and skip revalidation entirely.
#   - default    index.html (served for every SPA route) must NEVER be cached
#                without revalidation: a cached copy keeps referencing old hashed
#                bundles after a deploy, so users run a stale app until a hard
#                reload (observed during the 2026-07 UX benchmark).
#   - /api/*     empty string => nginx adds nothing at all, leaving the backend's
#                own cache headers untouched (matches the pre-#309 behaviour).
# $uri is the *rewritten* URI, so the SPA fallback is evaluated as /index.html.
map $uri $dq_cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
}

# The WebSocket origin named in connect-src below. The externally visible origin
# is only knowable from the request — nginx listens on 8080 behind a published
# port, so $server_port/$server_name cannot produce it — but a client-supplied
# Host must never land verbatim in a response header (#309). Everything that is
# not a bare hostname[:port] (or a bracketed IPv6 literal) maps to the empty
# string, and connect-src falls back to 'self' alone. To pin a deployment to one
# fixed origin, drop the regex line and make the default the literal value
# ("ws://dq.example.com wss://dq.example.com").
# `[[]` / `[]]` are literal brackets written as character classes: a backslash
# inside an nginx quoted string is an escape, so the regex must avoid one.
map $http_host $dq_ws_origin {
    default "";
    "~^(([A-Za-z0-9.-]{1,253}|[[][0-9A-Fa-f:.]{2,45}[]])(?::[0-9]{1,5})?)$" "ws://$1 wss://$1";
}

server {
    # 8080, not 80: the image runs nginx as a non-root user, which cannot bind a
    # privileged port. docker-compose maps the host's 3000 -> 8080 (#292).
    # default_server is explicit documentation that this block answers for ANY
    # Host — `server_name _` is a catch-all, not a Host allowlist, which is why
    # $http_host is validated through a map before it reaches a header.
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (#309). A literal `proxy_pass http://api:8000`
    # resolves the name ONCE, at config load, and caches that IP for the life of
    # the worker: recreating the api container (`docker compose up --build -d
    # api` — the documented rebuild) then left the UI serving 502s until the
    # frontend container was restarted too. A resolver plus a variable in
    # proxy_pass defers the lookup to request time and refreshes it every
    # `valid=`. It also means an unresolvable upstream no longer stops nginx
    # from starting, so the static UI keeps loading when the API is down.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # ---- response headers: ONE copy, server level (#292, single-sourced #309) --
    # Every add_header in this file lives here. nginx inherits them into any
    # location that declares NO add_header of its own, and drops ALL of them in a
    # location that declares one — so per-response variation is done with a
    # variable (the maps above), never with a second add_header. Adding an
    # add_header to a location silently removes the security headers from it; CI
    # fails the build if one appears inside a location block, and the stack job
    # asserts the CSP really is on /, /assets/* and a deep link.
    # `always` so error and proxy-error responses carry them too.
    #
    # Content-Security-Policy notes:
    #  - script-src: strict 'self' plus ONE sha256 hash. index.html carries a
    #    single inline bootstrap script (pre-paint appearance, #171) that must
    #    stay inline to beat first paint; allowing it by hash keeps 'unsafe-inline'
    #    out. CI recomputes this hash from the BUILT index.html and fails the
    #    build if it drifts (see .github/workflows/ci.yml, "Verify CSP script hash").
    #  - style-src keeps 'unsafe-inline': React style props and CodeMirror's
    #    runtime style injection produce element-level styles at runtime.
    #  - connect-src pins the API/WebSocket origin to this host. 'self' alone is
    #    specified to cover same-origin ws:// in CSP3, but browser coverage has
    #    been uneven, so the assistant chat socket
    #    (ws(s)://<host>/api/v1/chat/ws/...) is named explicitly via
    #    $dq_ws_origin rather than opened up with a `ws:` wildcard.
    #  - img-src allows data: for the inline SVG favicon.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-SD8VFcHhmPZCgrCjcb5UMCXe1BPexVbNI+VuLxJFSoE='; connect-src 'self' $dq_ws_origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # no-referrer: app URLs carry dataset/check ids — don't leak them to any
    # third party a user navigates to from the docs pages.
    add_header Referrer-Policy "no-referrer" always;
    # Deliberately NOT `always`, unlike the security headers above: this must
    # cover 200/304 and stay off error responses. With `always`, a missing
    # /assets/* bundle would answer 404 carrying `immutable, max-age=1y`, so a
    # client that raced a half-finished deploy would cache that 404 for a year.
    add_header Cache-Control $dq_cache_control;

    # Content-hashed build assets. =404 (not the SPA fallback) on purpose: a
    # missing bundle must fail loudly instead of returning index.html with a
    # 200 and an HTML content-type.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend container (HTTP + WebSocket).
    location /api/ {
        # Variable upstream ON PURPOSE — see `resolver` above. Because the
        # upstream carries a variable, nginx no longer derives the proxied URI
        # from the location, so it is spelled out: $request_uri is the original
        # path *and* query string, byte for byte, which is what the literal
        # `proxy_pass http://api:8000` (no URI part) used to send. Do not drop
        # the $request_uri suffix and do not add a trailing slash to it — either
        # rewrites the path the backend sees.
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;  # profiling / RCA / chat turns can take a while
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;  # tiny responses cost more to compress than to send
    gzip_vary on;          # correct proxy caching for mixed-encoding clients
}
