# Included at http level (conf.d), so map{} is allowed here.
# Pass WebSocket upgrades through to the backend (assistant chat),
# keep plain keepalive semantics for normal API requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    # 8080, not 80: the image runs nginx as a non-root user, which cannot bind a
    # privileged port. docker-compose maps the host's 3000 -> 8080 (#292).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- security headers (#292) --------------------------------------------
    # nginx does NOT inherit add_header into a location that declares its own,
    # so this block is repeated verbatim in every location that sets a header
    # (/ and /assets/). Keep the three copies in sync. `always` so error and
    # proxy-error responses carry them too.
    #
    # Content-Security-Policy notes:
    #  - script-src: strict 'self' plus ONE sha256 hash. index.html carries a
    #    single inline bootstrap script (pre-paint appearance, #171) that must
    #    stay inline to beat first paint; allowing it by hash keeps 'unsafe-inline'
    #    out. CI recomputes this hash from the BUILT index.html and fails the
    #    build if it drifts (see .github/workflows/ci.yml, "Verify CSP script hash").
    #  - style-src keeps 'unsafe-inline': React style props and CodeMirror's
    #    runtime style injection produce element-level styles at runtime.
    #  - connect-src pins the API/WebSocket origin to this exact host. 'self'
    #    alone is specified to cover same-origin ws:// in CSP3, but browser
    #    coverage has been uneven, so the assistant chat socket
    #    (ws(s)://<host>/api/v1/chat/ws/...) is named explicitly rather than
    #    opened up with a `ws:` wildcard.
    #  - img-src allows data: for the inline SVG favicon.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-SD8VFcHhmPZCgrCjcb5UMCXe1BPexVbNI+VuLxJFSoE='; connect-src 'self' ws://$http_host wss://$http_host" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # no-referrer: app URLs carry dataset/check ids — don't leak them to any
    # third party a user navigates to from the docs pages.
    add_header Referrer-Policy "no-referrer" always;

    # Content-hashed build assets never change under the same name — let
    # browsers keep them for a year and skip revalidation entirely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-SD8VFcHhmPZCgrCjcb5UMCXe1BPexVbNI+VuLxJFSoE='; connect-src 'self' ws://$http_host wss://$http_host" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html (served for every app route) must NEVER be
    # cached without revalidation: a cached copy keeps referencing old hashed
    # bundles after a deploy, so users run a stale app until a hard reload
    # (observed during the 2026-07 UX benchmark after an image rebuild).
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-SD8VFcHhmPZCgrCjcb5UMCXe1BPexVbNI+VuLxJFSoE='; connect-src 'self' ws://$http_host wss://$http_host" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend container (HTTP + WebSocket).
    # No add_header here on purpose: with none declared, the server-level
    # security headers above are inherited.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;  # profiling / RCA / chat turns can take a while
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;  # tiny responses cost more to compress than to send
    gzip_vary on;          # correct proxy caching for mixed-encoding clients
}
