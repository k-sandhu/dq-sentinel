name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly dependency audit (#292). A CVE is disclosed against code that has not
  # changed, so a trigger tied to commits never fires when it matters. Mondays
  # 07:00 UTC. Only `dependency-audit` runs on this trigger — every other job is
  # gated off it below, because rebuilding an unchanged main proves nothing and
  # burns 30 minutes of runner time.
  schedule:
    - cron: "0 7 * * 1"

# One in-flight run per ref. On a PR a follow-up push supersedes the previous
# run instead of queueing behind it — these jobs build images and boot a stack,
# and only the tip commit's result gates the merge.
#
# NOT on main: main is the branch CI exists to gate, so every commit on it must
# get a complete verdict. Cancelling there leaves a merged commit whose only run
# says "cancelled" — indistinguishable from a run that would have failed, and
# the release/rollback question ("was this commit ever green?") becomes
# unanswerable. Consecutive pushes to main queue and each gets a full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: ruff check backend/app backend/tests scripts data
      - name: Compile scripts and data utilities
        run: python -m compileall -q scripts data
      - name: Validate Docker Compose config
        run: docker compose config --quiet
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/dq-sentinel.json > /dev/null
      - name: Tests (pytest)
        working-directory: backend
        run: pytest -q

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Test (vitest)
        working-directory: frontend
        run: npm test
      # nginx.conf ships a strict CSP whose script-src allows index.html's single
      # inline bootstrap script by sha256 hash (#292). Edit that script and the
      # hash goes stale — the browser then silently blocks the pre-paint theme
      # bootstrap. Recompute from the BUILT index.html and fail loudly instead.
      #
      # "the hash appears SOMEWHERE in nginx.conf" was not enough (#309): the CSP
      # was repeated verbatim in three blocks, so updating one copy and leaving
      # `location /` stale broke the app at runtime with CI green. The conf now
      # keeps a single server-level copy; both invariants below keep it that way.
      - name: Verify CSP script hash matches built index.html
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, re, sys

          html = pathlib.Path("dist/index.html").read_text(encoding="utf-8")
          conf = pathlib.Path("nginx.conf").read_text(encoding="utf-8")
          inline = [
              m.group(2)
              for m in re.finditer(r"<script([^>]*)>(.*?)</script>", html, re.S)
              if "src=" not in m.group(1)
          ]
          hashes = [
              "sha256-" + base64.b64encode(hashlib.sha256(b.encode()).digest()).decode()
              for b in inline
          ]

          # Walk the conf tracking brace depth, comments stripped. `server {` is
          # depth 1; a location body is deeper.
          csp_headers, nested = [], []
          depth = 0
          for lineno, raw in enumerate(conf.splitlines(), 1):
              line = raw.split("#", 1)[0]
              if "add_header" in line:
                  if depth > 1:
                      nested.append(f"  nginx.conf:{lineno}: {line.strip()}")
                  if "Content-Security-Policy" in line:
                      csp_headers.append((lineno, line))
              depth += line.count("{") - line.count("}")

          problems = []
          if nested:
              problems.append(
                  "add_header inside a location block. nginx drops EVERY inherited "
                  "add_header in a context that declares one of its own, so this "
                  "silently strips the security headers from those responses. Vary "
                  "the value with a map instead (see $dq_cache_control):\n" + "\n".join(nested)
              )
          if not csp_headers:
              problems.append("no `add_header Content-Security-Policy` found in frontend/nginx.conf")
          for h in hashes:
              stale = [f"  nginx.conf:{n}" for n, line in csp_headers if h not in line]
              if stale:
                  problems.append(
                      f"CSP drift: index.html's inline script hashes to '{h}', which is "
                      f"missing from {len(stale)} of {len(csp_headers)} Content-Security-Policy "
                      f"header(s). Add it to script-src on:\n" + "\n".join(stale)
                  )
          if problems:
              sys.exit("\n\n".join(problems))
          print(
              f"CSP ok: {len(inline)} inline script(s) allowed by hash in "
              f"{len(csp_headers)} CSP header(s); all add_header directives at server level"
          )
          PY

  # Migrations only ever ran against SQLite (with render_as_batch, so the DDL is
  # not the DDL prod gets) while init_db() runs `upgrade head` at boot on
  # PostgreSQL — a PG-only migration bug bricked api+worker startup (#291).
  # Exercise the real engine, both directions.
  migrations-postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dq
          POSTGRES_PASSWORD: dq
          POSTGRES_DB: dqsentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dq -d dqsentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with the postgres driver)
        run: pip install -e "backend[dev,postgres]"
      - name: Migrate up, all the way down, and up again
        working-directory: backend
        env:
          # migrations/env.py resolves the URL from app settings.
          DQ_DATABASE_URL: postgresql+psycopg://dq:dq@localhost:5432/dqsentinel
        run: |
          set -e
          alembic upgrade head
          alembic current
          alembic downgrade base   # every revision's downgrade() must work on PG too
          alembic upgrade head
          alembic current

  # Build the shipped images and boot the real stack, then drive the documented
  # end-to-end workflow through it (#292). `docker compose config` alone never
  # caught a broken Dockerfile, a non-root permission problem, or a healthcheck
  # that never goes green.
  stack:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the smoke-test client
        run: pip install httpx
      - name: Generate sample data (compose mounts ./samples read-only)
        run: python data/generate_sample_data.py
      - name: Generate ephemeral prod-posture secrets
        # The stack boots with DQ_ENV=prod (the compose default), which refuses to
        # start on insecure defaults (#155). Satisfy the guard with per-run random
        # values instead of weakening it — this job is what proves the guard is
        # satisfiable by a real deployment.
        run: |
          {
            echo "DQ_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "DQ_BOOTSTRAP_ADMIN_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          } >> "$GITHUB_ENV"
      - name: Build images and boot the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Show service state
        run: docker compose ps
      - name: Frontend serves the app with its security headers
        # The CSP and its siblings are ONE server-level add_header (#309), and
        # nginx drops every inherited add_header in a location that declares its
        # own — so assert the real runtime header on all three shapes of response:
        # the index, a hashed asset (location /assets/) and a deep link (the SPA
        # fallback). Grepping the static `<div id="root">` renders either way and
        # proves nothing about the headers.
        run: |
          set -euo pipefail
          curl -sS -D headers.txt -o body.html http://127.0.0.1:3000/
          grep -q '<div id="root">' body.html
          grep -iq '^cache-control: no-cache' headers.txt   # index.html must revalidate (#280)
          assets=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' body.html)
          asset=${assets%%$'\n'*}   # first match, without a `| head` SIGPIPE under pipefail
          test -n "$asset"
          for path in / /datasets/1/checks "$asset"; do
            curl -sS -D h.txt -o /dev/null "http://127.0.0.1:3000$path"
            for header in 'content-security-policy:.*sha256-' 'x-content-type-options: nosniff' \
                          'x-frame-options: DENY' 'referrer-policy: no-referrer'; do
              grep -iq "^$header" h.txt || {
                echo "::error::missing '$header' on $path"; cat h.txt; exit 1; }
            done
            echo "security headers ok on $path"
          done
          # ...and the per-response bits still differ, which is what the map does.
          curl -sS -D h.txt -o /dev/null "http://127.0.0.1:3000$asset"
          grep -iq '^cache-control: public, max-age=31536000, immutable' h.txt
          cat headers.txt
      - name: Frontend proxies /api to the api container
        # proxy_pass now goes through a resolver + a variable so a recreated api
        # container does not strand nginx on a dead IP (#309). A variable upstream
        # stops nginx deriving the proxied URI from the location, so prove the path
        # and query string still arrive intact: the same request must get the same
        # status through the UI as it does straight at the API.
        run: |
          set -euo pipefail
          curl -sS http://127.0.0.1:3000/api/v1/health -o via-ui.json
          python3 -c 'import json;d=json.load(open("via-ui.json"));assert d["status"]=="ok",d'
          q='/api/v1/datasets?connection_id=1'
          direct=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$q")
          viaui=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$q")
          test "$direct" = "$viaui"
          echo "proxied $q -> $viaui (direct: $direct)"
      - name: End-to-end smoke test against the stack
        # The smoke test authenticates as the bootstrapped admin, reading
        # DQ_BOOTSTRAP_ADMIN_PASSWORD (exported above — the value the stack booted
        # with) so the generated secret never lands in a command line, a process
        # listing or this log. It used to hardcode admin@example.com/admin123,
        # which forced this job to first PATCH the seeded admin's password back to
        # the insecure dev default just to log in (#309).
        run: |
          python scripts/e2e_smoke.py --base http://127.0.0.1:8000 \
            --dsn sqlite:////data/samples/shopdb.sqlite
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Advisory only: a new CVE disclosure should show up here, not turn every PR
  # red until an upstream fix ships. Dependabot (.github/dependabot.yml) does the
  # actual bumping.
  #
  # Deliberately NOT gated on the event: this is the one job that must also run on
  # the weekly `schedule` trigger above, since vulnerabilities appear without a
  # commit to trigger on.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Now a real gate rather than advisory. It was continue-on-error while
    # `npm audit` had no way to say "known and justified", which left it
    # permanently red -- the alert-fatigue pattern this product exists to fight,
    # and a check nobody reads will not report the next real CVE. The expiring
    # allowlist below gives it that vocabulary, so it can block. To go back to
    # advisory, restore `continue-on-error: true`.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend image dependencies (requirements.lock)
        # --no-deps: the lock is already a fully pinned resolution, so audit
        # exactly what the image installs, nothing more.
        run: pip-audit --no-deps --desc --requirement backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        # npm audit has no ignore mechanism, so its JSON goes through a gate that
        # fails on anything not explicitly AND unexpiredly justified. Piping makes
        # node's exit code the step's, which is what we want: `npm audit` exits 1
        # whenever it reports anything, including advisories we have already
        # assessed. See frontend/scripts/audit-allowlist.mjs for the entries --
        # each carries an expiry, and a stale entry fails the gate too.
        run: npm audit --omit=dev --json | node scripts/audit-allowlist.mjs
