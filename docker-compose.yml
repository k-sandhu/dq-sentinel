# Full stack: PostgreSQL app DB + API + scheduler worker + nginx frontend.
#   docker compose up --build      ->  UI on http://localhost:3000
#   docker compose up --build --wait   (blocks until every service is healthy)
# The Prometheus/Grafana/Loki observability stack is opt-in:
#   docker compose --profile monitoring up --build
# Set ANTHROPIC_API_KEY in your shell or a .env file to enable AI features.
# Mount your source databases (read-only) into the api+worker containers, e.g.
# the bundled sample under ./samples (generate it first:
#   python data/generate_sample_data.py).
#
# Ports: the UI is on :3000 (nginx, which proxies /api to the api container).
# The API is published on 127.0.0.1:8000 ONLY — loopback, not every interface —
# because /metrics is unauthenticated by design (#292). Scripts that talk to the
# API directly (scripts/e2e_smoke.py --base http://127.0.0.1:8000) still work
# from the host; nothing else on the network can reach it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dqsentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dqsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    init: true  # PID 1 signal forwarding + zombie reaping for graceful stop (#157)
    stop_grace_period: 30s
    environment: &backend_env
      # Deployment posture (#155): prod (default) makes the API/worker refuse to
      # boot on insecure defaults. For a throwaway LOCAL demo set DQ_ENV=dev.
      DQ_ENV: ${DQ_ENV:-prod}
      DQ_DATABASE_URL: postgresql+psycopg://dq:dq@postgres:5432/dqsentinel
      # REQUIRED in prod — no insecure fallback is shipped. Generate one with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      DQ_SECRET_KEY: ${DQ_SECRET_KEY:-}
      # REQUIRED in prod — a strong password for the seeded first admin.
      DQ_BOOTSTRAP_ADMIN_PASSWORD: ${DQ_BOOTSTRAP_ADMIN_PASSWORD:-}
      DQ_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DQ_LOG_FORMAT: json
      # LLM (provider-agnostic): set ANTHROPIC_API_KEY for native Anthropic, or
      # DQ_LLM_API_KEY + DQ_LLM_MODEL for any OpenAI-compatible endpoint
      # (defaults to OpenRouter; override DQ_LLM_BASE_URL for vLLM/Ollama/etc).
      DQ_LLM_PROVIDER: ${DQ_LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DQ_LLM_API_KEY: ${DQ_LLM_API_KEY:-}
      DQ_LLM_BASE_URL: ${DQ_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      DQ_LLM_MODEL: ${DQ_LLM_MODEL:-}
    volumes:
      - ./samples:/data/samples:ro # register with dsn sqlite:////data/samples/shopdb.sqlite
      - ./docs:/docs:ro # in-app /docs documentation browser reads markdown from here
      # Built-in catalog datasets are generated lazily on first connect; api and
      # worker must see the SAME files (#261), hence a shared named volume. The
      # image sets DQ_CATALOG_DATA_DIR=/data/catalog and pre-creates it owned by
      # the non-root user, so the volume inherits that ownership.
      - catalogdata:/data/catalog
    ports:
      # Loopback only: /metrics is unauthenticated by design (#292).
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # healthcheck: inherited from backend/Dockerfile (GET /api/v1/health)

  worker:
    build: ./backend
    restart: unless-stopped
    init: true  # PID 1 signal forwarding so SIGTERM reaches the worker (#157)
    stop_grace_period: 30s  # bound the in-flight-check drain before a forced SIGKILL
    command: python -m app.worker
    environment: *backend_env
    volumes:
      - ./samples:/data/samples:ro
      - catalogdata:/data/catalog
    # Bound a runaway check (pandas profiling / IsolationForest on a wide table)
    # so it degrades this container instead of starving the host and the API.
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    # The worker has no HTTP API, so the image's /api/v1/health probe does not
    # apply — probe its Prometheus endpoint (DQ_WORKER_METRICS_PORT) instead,
    # which only answers once the scheduler process is actually up.
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request as u; u.urlopen('http://127.0.0.1:9100/metrics', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # nginx runs unprivileged inside the container and listens on 8080 (#292);
      # the UI is still on http://localhost:3000.
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    # healthcheck: inherited from frontend/Dockerfile (static GET / on :8080)

  # ---- observability (all open source: Prometheus / Grafana OSS / Loki) ----
  # Opt-in via profile so a first demo is 4 containers, not 8:
  #   docker compose --profile monitoring up --build
  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.4.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.4.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:11.6.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  catalogdata:  # shared api+worker scratch for generated catalog datasets (#261)
  promdata:
  lokidata:
  grafanadata:
